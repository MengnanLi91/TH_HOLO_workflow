site_name: TH_HOLO_workflow
site_description: PhysicsNeMo-based ETL and surrogate-modeling pipeline for MOOSE thermal-hydraulics simulations.
site_url: https://example.invalid/th-holo-workflow/
repo_url: https://github.com/MengnanLi91/TH_HOLO_workflow
repo_name: MengnanLi91/TH_HOLO_workflow
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Architecture: architecture.md
  - User Guide:
      - Getting Started: user/getting_started.md
      - Alpha-D Surrogate Tutorial: user/alpha_d_surrogate.md
      - Hyperparameter Optimization: user/hyperparameter_optimization.md
      - Case Distribution Analysis: user/case_distribution_analysis.md
  - Cases:
      - MOOSE Grid: cases/moose_grid.md
      - Alpha-D: cases/alpha_d.md
      - Case Pressure Drop: cases/case_pressure_drop.md
  - Developer:
      - ETL Pipeline: dev/etl_pipeline.md
      - Dataset API: dev/dataset.md
      - FNO Training and Evaluation: dev/fno_train_eval.md
  - Reference:
      - Conv1D Checkpoint Migration: reference/conv1d_checkpoint_migration.md
  - Archive:
      - Repo Layout Refactor Plan: dev/repo_layout_refactor_plan.md
