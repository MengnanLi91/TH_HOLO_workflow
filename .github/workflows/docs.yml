name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; queue runs and cancel in-progress
# duplicates of the same workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        # Heavy runtime deps (torch, physicsnemo, zarr) are mocked at autodoc
        # time via autodoc_mock_imports in docs/conf.py, so the [docs] extra
        # is all CI needs.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build HTML
        run: make -C docs html SPHINXOPTS="-q"

      - name: Configure Pages
        # enablement: true asks the action to turn Pages on (with Actions
        # as the source) the first time it runs, instead of failing with
        # "Get Pages site: Not Found". Requires the workflow's pages:write
        # permission, which is set above. Becomes a no-op once Pages is
        # already enabled, so it's safe to leave in place permanently.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact (deploy-eligible)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Upload preview artifact (PR builds)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/_build/html
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
