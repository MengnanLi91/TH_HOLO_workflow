[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multifid-th"
version = "0.1.0"
description = "Multifidelity surrogates for thermal-hydraulics on MOOSE outputs"
requires-python = ">=3.11"
# Runtime deps (torch, physicsnemo, zarr, hydra-core, …) are pinned in
# the Dockerfiles in docker/. Keep this list empty so `pip install -e .`
# inside the existing images is a no-op for dependency resolution.
dependencies = []

[project.optional-dependencies]
# Documentation build deps. Install with `pip install -e ".[docs]"`, then
# `make -C docs html`. Kept unpinned to match the project convention of
# pinning runtime versions inside the Dockerfiles, not in pyproject.
docs = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinxcontrib-mermaid",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-autobuild",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["read_exdous"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["training*", "feature_selection*", "cases*", "dataset*"]
namespaces = false
