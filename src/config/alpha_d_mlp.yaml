defaults:
  - default
  - _self_

model:
  name: mlp
  params:
    # Defaults below carry over the previous HPO winners so `hpo=null`
    # runs are reasonable.  Re-run HPO when the loss surface changes
    # (e.g. switching the target encoding or enabling residual mode).
    layer_size: 128
    num_layers: 6
    activation_fn: silu
    skip_connections: true
    dropout: 0.062

data:
  zarr_dir: ../data/flow_contraction_expansion/parametric_study/processed
  # Selected via PyCaret + region indicators added back so per-region eval metrics fire.
  # The three trailing columns (dD_dz_local + signed throat distances) are
  # neighbour-context features added in v5 to give the pointwise MLP some
  # geometric awareness it otherwise lacks (see throat R²~0.3 problem).
  input_columns: null
  input_columns_file: ../data/feature_analysis/pycaret/default/selected_features.txt
  output_columns: [signed_log1p_alpha_D]
  normalize: true
  # Region weights from previous HPO (both 1.0 — neutral).
  throat_weight: 1.0
  downstream_weight: 1.0
  include_case_idx: true
  local_velocity_normalization: true
  # Predict the residual against a closed-form sudden contraction-expansion
  # baseline (K_c, K_e, Blasius throat friction).  The model output is
  # signed_log1p(alpha_D) − signed_log1p(alpha_D_baseline); the baseline is
  # added back at every decode boundary (eval, plotting, delta_p loss).
  target_residual_baseline: true
  min_Dr: 0.333
  exclude_cases: []
  split:
    strategy: stratified
    train_ratio: 0.8
    seed: 42
    n_bins: 3

training:
  epochs: 1000
  # Batch / lr / weight_decay carry over the previous HPO winners.
  batch_size: 512
  num_workers: 4
  lr: 8.3e-4
  seed: 42
  device: auto
  loss: relative_l2
  weight_decay: 9.8e-3
  lr_scheduler: cosine
  lr_warmup_epochs: 10
  experiment: training.experiments.alpha_d:AlphaDExperiment
  consistency_weight: 0.0
  delta_p_weight: 0.0  # disabled; rely on the encoded target alone
  early_stopping:
    patience: 30
    val_ratio: 0.15

eval:
  checkpoint: ${output.checkpoint}
  run_meta: null
  batch_size: 4
  num_workers: 0
  device: auto
  experiment: null

output:
  plot_dir: ${output.case_dir}/plots
  plot_max_cases: 3
  plot_case_indices: null
  plot_velocity_x_field: vel_x
  plot_velocity_y_field: vel_y
  plot_quiver_step: 4
  plot_cmap: viridis
  plot_dpi: 150

# Hyperparameter optimization.  Set hpo=null on the CLI to skip HPO and
# train directly with the parameters above.
hpo:
  # v5 — input dim grew from 9 to 12 with the addition of neighbour
  # context features (dD_dz_local, dist_to_throat_start,
  # dist_to_throat_end) in the ETL.  Bump study_name whenever the
  # input dimensionality, objective, or search space changes (Optuna
  # otherwise mixes incompatible runs in the SQLite store).
  study_name: alpha_d_mlp_hpo_residual_v5
  # Weight on the val Δp term in the HPO objective.  ~1.0 puts encoded
  # val loss and val Δp on the same order of magnitude in the current
  # dataset; raise to bias HPO toward Δp accuracy at the expense of
  # pointwise fit, lower for the reverse.
  delta_p_objective_weight: 1.0
  direction: minimize
  n_trials: 50
  seed: 42
  show_progress_bar: true
  storage: sqlite:///${hpo.output_dir}/${hpo.study_name}.db
  load_if_exists: true
  retrain_best: true
  output_dir: ${output.case_dir}/hpo

  sampler:
    name: TPESampler
    params:
      seed: ${hpo.seed}

  pruner:
    name: MedianPruner
    params:
      n_startup_trials: 5
      n_warmup_steps: 10

  validation:
    split_ratio: 0.2
    seed: ${hpo.seed}

  search_space:
    training.lr:
      type: float
      low: 1.0e-5
      high: 1.0e-3
      log: true

    training.batch_size:
      type: categorical
      choices: [512, 1024, 2048]

    training.weight_decay:
      type: float
      low: 1.0e-4
      high: 1.0e-2
      log: true

    model.params.layer_size:
      type: categorical
      choices: [128, 256]

    model.params.num_layers:
      type: int
      low: 5
      high: 8

    model.params.dropout:
      type: float
      low: 0.01
      high: 0.1

    data.throat_weight:
      type: categorical
      choices: [1.0, 3.0, 5.0, 10.0]

    data.downstream_weight:
      type: categorical
      choices: [1.0, 2.0, 3.0, 5.0]

    # Pressure-drop integral loss weight.  Wider than the previous 0–0.05
    # range so HPO can actually explore the regime where Δp loss
    # dominates and re-biases toward throat samples that drive the
    # integral.
    training.delta_p_weight:
      type: categorical
      choices: [0.0, 0.05, 0.1, 0.25, 0.5]
