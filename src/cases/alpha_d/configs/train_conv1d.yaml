defaults:
  - default
  - _self_

hydra:
  searchpath:
    - pkg://training.config       # finds default.yaml
    - pkg://cases.alpha_d.configs # finds sibling case configs

model:
  name: conv1d_profile
  params:
    hidden_channels: 64
    num_blocks: 4
    kernel_size: 5
    dilations: [1, 2, 4, 1]
    dropout: 0.05

data:
  zarr_dir: ../data/flow_contraction_expansion/parametric_study/processed
  # ProfileAdapter is case-agnostic; the case's build_dataset constructs
  # AlphaDProfileDataset (which default-injects engineered features and the
  # residual target_transform).
  dataset_entrypoint: cases.alpha_d.datasets.profile:build_dataset
  input_columns: null
  input_columns_file: ../data/feature_analysis/pycaret/default/selected_features.txt
  output_columns: [signed_log1p_alpha_D]
  normalize: true
  # AlphaDProfileDataset default-injects target_transform for the conv1d path.
  local_velocity_normalization: true
  include_case_idx: true
  throat_weight: 1.0
  downstream_weight: 1.0
  min_Dr: 0.333
  exclude_cases: []
  exclude_cases_file: null
  split:
    strategy: stratified
    train_ratio: 0.8
    seed: 42
    n_bins: 3

training:
  epochs: 500
  batch_size: 32
  num_workers: 4
  lr: 3.0e-4
  seed: 42
  device: auto
  loss: relative_l2
  weight_decay: 1.0e-5
  lr_scheduler: cosine
  lr_warmup_epochs: 10
  experiment: cases.alpha_d.experiment:AlphaDExperiment
  early_stopping:
    patience: 30
    val_ratio: 0.15

eval:
  checkpoint: ${output.checkpoint}
  run_meta: null
  batch_size: 8
  num_workers: 0
  device: auto
  experiment: null

hpo:
  # Bump study_name (e.g. append _v6, _v7, …) whenever the input feature
  # set, target encoding, or search space changes — Optuna otherwise mixes
  # incompatible trials in the SQLite store.
  study_name: alpha_d_conv1d_hpo_v5
  direction: minimize
  n_trials: 30
  seed: 42
  show_progress_bar: true
  storage: sqlite:///${hpo.output_dir}/${hpo.study_name}.db
  load_if_exists: true
  retrain_best: true
  output_dir: ${output.case_dir}/hpo

  sampler:
    name: TPESampler
    params:
      seed: ${hpo.seed}

  pruner:
    name: MedianPruner
    params:
      n_startup_trials: 5
      n_warmup_steps: 10

  validation:
    split_ratio: 0.2
    seed: ${hpo.seed}

  search_space:
    training.lr:
      type: float
      low: 1.0e-5
      high: 1.0e-3
      log: true

    training.batch_size:
      type: categorical
      choices: [16, 32, 64]

    training.weight_decay:
      type: float
      low: 1.0e-6
      high: 1.0e-3
      log: true

    model.params.hidden_channels:
      type: categorical
      choices: [32, 64, 96, 128]

    model.params.num_blocks:
      type: int
      low: 2
      high: 5

    model.params.kernel_size:
      type: categorical
      choices: [3, 5, 7]

    model.params.dropout:
      type: float
      low: 0.0
      high: 0.2

    data.throat_weight:
      type: categorical
      choices: [1.0, 3.0, 5.0, 10.0]

    data.downstream_weight:
      type: categorical
      choices: [1.0, 2.0, 3.0, 5.0]
