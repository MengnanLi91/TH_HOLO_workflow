defaults:
  - default
  - _self_

hydra:
  searchpath:
    - pkg://training.config       # finds default.yaml
    - pkg://cases.alpha_d.configs # finds sibling case configs

model:
  name: conv1d_profile
  params:
    hidden_channels: 96
    num_blocks: 3
    kernel_size: 5
    dilations: [1, 2, 4, 1]
    dropout: 0.05

data:
  zarr_dir: ../data/flow_contraction_expansion/parametric_study/processed
  dataset_entrypoint: cases.alpha_d.datasets.profile:build_dataset
  input_columns:
    - Dr
    - Lr
    - log10_Re_throat
    - z_hat
    - z_hat_times_Dr
    - z_hat_times_Lr
    - dist_to_throat_start
    - dist_to_throat_end
    - dist_to_nearest_step
  # The study workflow replaces this with its PyCaret artifact before HPO.
  # Retaining the curated columns above makes direct component runs reproducible.
  input_columns_file: null
  output_columns: [signed_log1p_alpha_D]
  normalize: true
  include_acceleration_head: true
  local_velocity_normalization: true
  include_case_idx: true
  throat_weight: 5.0
  downstream_weight: 3.0
  min_Dr: 0.333
  exclude_cases: []
  exclude_cases_file: null
  split:
    strategy: stratified
    train_ratio: 0.8
    seed: 42
    n_bins: 3

training:
  epochs: 500
  batch_size: 32
  num_workers: 4
  lr: 3.0e-4
  seed: 42
  device: auto
  loss: relative_l2
  weight_decay: 1.0e-5
  lr_scheduler: cosine
  lr_warmup_epochs: 10
  experiment: cases.alpha_d.experiment:AlphaDExperiment
  early_stopping:
    patience: 30
    val_ratio: 0.15

eval:
  checkpoint: ${output.checkpoint}
  run_meta: null
  batch_size: 8
  num_workers: 0
  device: auto
  experiment: null

hpo:
  study_name: alpha_d_conv1d_clean_v1
  direction: minimize
  show_progress_bar: true
  storage: sqlite:///${hpo.output_dir}/${hpo.study_name}.db
  load_if_exists: true
  retrain_best: true
  output_dir: ${output.case_dir}/hpo

  screening:
    n_trials: 40
    max_epochs: 200
    early_stopping:
      patience: 20
      min_delta: 0.0

  sampler:
    name: TPESampler
    params:
      seed: ${hpo.validation.seed}

  pruner:
    name: MedianPruner
    params:
      n_startup_trials: 5
      n_warmup_steps: 10

  validation:
    splitter_entrypoint: cases.alpha_d.hpo:balanced_parameter_folds
    n_folds: 3
    screening_fold: 0
    seed: 42

  objective:
    weights:
      delta_p_log_abs_error_mean: 1.0
      delta_p_relative_error_p90: 0.25
      profile_val_loss: 0.05

  confirmation:
    top_k: 5
    max_epochs: 500
    early_stopping:
      patience: 30
      min_delta: 0.0
    aggregate_std_weight: 0.5
    guard_metric: max_abs_lr_level_bias
    guard_reference: best_control

  enqueue_trials:
    - name: july_7
      params:
        training.lr: 0.00031227062983797785
        training.batch_size: 32
        training.weight_decay: 0.00009726436677565929
        model.params.hidden_channels: 96
        model.params.num_blocks: 3
        model.params.kernel_size: 3
        model.params.dropout: 0.06327159821527437
        data.throat_weight: 5.0
        data.downstream_weight: 3.0
    - name: alpha_d_conv1d_001
      params:
        training.lr: 0.00019931679794623093
        training.batch_size: 16
        training.weight_decay: 0.00041583445095567516
        model.params.hidden_channels: 96
        model.params.num_blocks: 3
        model.params.kernel_size: 5
        model.params.dropout: 0.18393244460497699
        data.throat_weight: 3.0
        data.downstream_weight: 3.0
    - name: hybrid
      params:
        training.lr: 0.00031227062983797785
        training.batch_size: 32
        training.weight_decay: 0.00009726436677565929
        model.params.hidden_channels: 96
        model.params.num_blocks: 3
        model.params.kernel_size: 5
        model.params.dropout: 0.06327159821527437
        data.throat_weight: 5.0
        data.downstream_weight: 3.0

  search_space:
    training.lr:
      type: float
      low: 1.0e-4
      high: 4.0e-4
      log: true

    training.batch_size:
      type: categorical
      choices: [16, 32]

    training.weight_decay:
      type: float
      low: 1.0e-5
      high: 5.0e-4
      log: true

    model.params.hidden_channels:
      type: categorical
      choices: [64, 96]

    model.params.num_blocks:
      type: categorical
      choices: [2, 3]

    model.params.kernel_size:
      type: categorical
      choices: [3, 5]

    model.params.dropout:
      type: float
      low: 0.02
      high: 0.2

    data.throat_weight:
      type: categorical
      choices: [3.0, 5.0]
