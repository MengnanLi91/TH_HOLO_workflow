defaults:
  - default
  - _self_

hydra:
  searchpath:
    - pkg://training.config       # finds default.yaml
    - pkg://cases.alpha_d.configs # finds sibling case configs

model:
  name: mlp
  params:
    # Defaults below carry over the previous HPO winners so `hpo=null`
    # runs are reasonable.  Re-run HPO when the loss surface changes
    # (e.g. switching the target encoding or enabling residual mode).
    layer_size: 128
    num_layers: 6
    activation_fn: silu
    skip_connections: true
    dropout: 0.062

data:
  zarr_dir: ../data/flow_contraction_expansion/parametric_study/processed
  # Synthesize alpha-D-specific engineered columns inside the dataset.
  # `engineered_features_spec` returns (names, builder); PointwiseAdapter
  # resolves the entrypoint and threads them into TabularPairDataset.
  engineered_features_entrypoint: cases.alpha_d.feature_data:engineered_features_spec
  # Selected via PyCaret + region indicators added back so per-region eval metrics fire.
  # Trailing columns (dD_dz_local + signed throat distances) are
  # neighbour-context features that give the pointwise MLP some geometric
  # awareness it otherwise lacks (helps the throat R² ≈ 0.3 problem).
  input_columns: null
  input_columns_file: ../data/feature_analysis/pycaret/default/selected_features.txt
  output_columns: [signed_log1p_alpha_D]
  normalize: true
  # Region weights from previous HPO (both 1.0 — neutral).
  throat_weight: 1.0
  downstream_weight: 1.0
  include_case_idx: true
  local_velocity_normalization: true
  # Predict the residual against a closed-form sudden contraction-expansion
  # baseline (K_c, K_e, Blasius throat friction).  The model output is
  # signed_log1p(alpha_D) − signed_log1p(alpha_D_baseline); the baseline is
  # added back at every decode boundary (eval, plotting, delta_p loss).
  target_transform: cases.alpha_d.transforms:alpha_d_residual_transform
  target_transform_kwargs:
    include_acceleration_head: ${data.include_acceleration_head}
  include_acceleration_head: true
  min_Dr: 0.333
  exclude_cases: []
  exclude_cases_file: null
  split:
    strategy: stratified
    train_ratio: 0.8
    seed: 42
    n_bins: 3

training:
  epochs: 1000
  # Batch / lr / weight_decay carry over the previous HPO winners.
  batch_size: 512
  num_workers: 4
  lr: 8.3e-4
  seed: 42
  device: auto
  loss: relative_l2
  weight_decay: 9.8e-3
  lr_scheduler: cosine
  lr_warmup_epochs: 10
  experiment: cases.alpha_d.experiment:AlphaDExperiment
  early_stopping:
    patience: 30
    val_ratio: 0.15

eval:
  checkpoint: ${output.checkpoint}
  run_meta: null
  batch_size: 4
  num_workers: 0
  device: auto
  experiment: null

output:
  plot_dir: ${output.case_dir}/plots
  plot_max_cases: 3
  plot_case_indices: null
  plot_velocity_x_field: vel_x
  plot_velocity_y_field: vel_y
  plot_quiver_step: 4
  plot_cmap: viridis
  plot_dpi: 150

# Hyperparameter optimization.  Set hpo=null on the CLI to skip HPO and
# train directly with the parameters above.
hpo:
  study_name: alpha_d_mlp_clean_v1
  direction: minimize
  show_progress_bar: true
  storage: sqlite:///${hpo.output_dir}/${hpo.study_name}.db
  load_if_exists: true
  retrain_best: true
  output_dir: ${output.case_dir}/hpo

  screening:
    n_trials: 40
    max_epochs: 200
    early_stopping:
      patience: 20
      min_delta: 0.0

  sampler:
    name: TPESampler
    params:
      seed: ${hpo.validation.seed}

  pruner:
    name: MedianPruner
    params:
      n_startup_trials: 5
      n_warmup_steps: 10

  validation:
    splitter_entrypoint: cases.alpha_d.hpo:balanced_parameter_folds
    n_folds: 3
    screening_fold: 0
    seed: 42

  objective:
    weights:
      delta_p_log_abs_error_mean: 1.0
      delta_p_relative_error_p90: 0.25
      profile_val_loss: 0.05

  confirmation:
    top_k: 5
    max_epochs: 500
    early_stopping:
      patience: 30
      min_delta: 0.0
    aggregate_std_weight: 0.5
    guard_metric: null
    guard_reference: null

  enqueue_trials: []

  search_space:
    training.lr:
      type: float
      low: 1.0e-5
      high: 1.0e-3
      log: true

    training.batch_size:
      type: categorical
      choices: [512, 1024, 2048]

    training.weight_decay:
      type: float
      low: 1.0e-4
      high: 1.0e-2
      log: true

    model.params.layer_size:
      type: categorical
      choices: [128, 256]

    model.params.num_layers:
      type: int
      low: 5
      high: 8

    model.params.dropout:
      type: float
      low: 0.01
      high: 0.1

    data.throat_weight:
      type: categorical
      choices: [1.0, 3.0, 5.0, 10.0]

    data.downstream_weight:
      type: categorical
      choices: [1.0, 2.0, 3.0, 5.0]
