# Lid-driven cavity flow — concrete ETL variant.
#
# Run via:
#   python cases/moose_grid/run_etl.py
defaults:
  - etl_base
  - _self_

etl:
  processing:
    num_processes: 4

  source:
    input_dir: ../data/lid-driven
    data_dir: ../data/lid-driven

  sink:
    output_dir: ../data/processed/lid-driven
